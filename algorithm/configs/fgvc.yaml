  dataset: pets
  root: '~/dataset'
  num_classes: 37

  base_batch_size: 128

run_config:
  warmup_epochs: 5
  n_epochs: 100

  bs256_lr: 0.1

  optimizer_name: sgd_scale_int_nomom

net_config:
  net_name: mcunet-5fps
  # net_name: mbv2-w0.35
  # net_name: proxyless-w0.3

backward_config:
  # quantize_gradient: 1
  # n_bit: 8

  ##### Full model
  # enable_backward_config: 0

  ##### cls-only
  enable_backward_config: 1
  n_bias_update: 0
  n_weight_update: 0
  
ZO_Estim:
  en: True

  # fc_bp: False
  fc_bp: cls_only
  # fc_bp: 'partial_BP'
  # fc_bp: 'break_BP'

  name: ZO_Estim_MC
  n_sample: 60
  signSGD: False

  n_sample_distri: half

  scale: dim

  trainable_param_list: ['weight', 'bias']
  trainable_layer_list: ['1.7.conv.0', '1.8.conv.0', '1.9.conv.0', '1.10.conv.0', '1.12.conv.0', '1.13.conv.0']

  estimate_method: forward
  # estimate_method: antithetic

  # sample_method: uniform
  # sample_method: gaussian
  sample_method: bernoulli
  # sample_method: coord_basis

  independent_wp: False
  set_seed: None

  ############################## Layerwise Mixture Perturbation ##############################
  obj_fn_type: classifier_layerwise
  perturb_method: mixture

  split_block_number: 4

  sigma: {
    'weight': 1,
    'bias': 100,
    'actv': 5,
  }
  # sigma: 0.1

  perturb_before_round: 0

  sync_batch_perturb: 0
  # sync_batch_perturb: 1

