# PEPITA Training Configuration

# Model Architecture
model:
  name: "resnet18"  # or your model name
  pretrained: false

# Training Parameters
training:
  num_epochs: 100
  batch_size: 128
  device: "cuda"  # or "cpu"
  
  # Learning Rate Schedule
  lr: 0.001
  lr_scheduler:
    type: "StepLR"
    step_size: 10
    gamma: 0.1

# PEPITA Specific Parameters
pepita:
  # Gradient Estimation Parameters
  sigma: 1.0  # Standard deviation for perturbation
  n_samples: 1  # Number of samples for gradient estimation
  
  # Trainable Layers
  trainable_layer_list:
    - "1.4.conv.0"
    - "1.5.conv.0"
    - "1.6.conv.0"
    - "1.7.conv.0"

# Data Parameters
data:
  dataset: "CIFAR10"  # or your dataset name
  num_workers: 4
  pin_memory: true

# Logging and Checkpointing
logging:
  save_path: "checkpoints/pepita_best_model.pth"
  log_interval: 10  # Log metrics every N batches 